name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: klik_laundry_test
          POSTGRES_USER: klik_laundry
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klik_laundry -d klik_laundry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: klik_laundry_test
      DB_USERNAME: klik_laundry
      DB_PASSWORD: test-only-password
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer manifest
        run: composer validate --strict --no-interaction

      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          /tmp/actionlint .github/workflows/ci.yml

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Verify Redis connection
        run: php artisan tinker --execute="Illuminate\Support\Facades\Redis::set('ci-health', 'ok'); throw_unless(Illuminate\Support\Facades\Redis::get('ci-health') === 'ok', new RuntimeException('Redis unavailable'));"

      - name: Backend tests
        run: php artisan test --exclude-group=browser

      - name: Static analysis
        run: composer analyse

      - name: PHP formatting
        run: composer format:check

      - name: Frontend lint
        run: npm run lint

      - name: TypeScript
        run: npm run types:check

      - name: Production build
        run: npm run build

      - name: Chromium browser suite
        run: php artisan test tests/Browser --browser chrome

      - name: Firefox browser smoke
        run: php artisan test tests/Browser --browser firefox --group=browser-smoke

      - name: Set up Grafana k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: '1.3.0'

      - name: k6 harness smoke
        env:
          M9_ALLOW_LOAD_TEST: 'true'
          M9_BASE_URL: http://127.0.0.1:8000
          M9_SMOKE: '1'
          M9_VALIDATE_ONLY: '1'
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/k6-server.log 2>&1 &
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:8000/up && break || sleep 1; done
          k6 run tests/Load/milestone-9.js

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Secret scan
        run: >-
          docker run --rm --network=none
          --volume "$PWD:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --verbose /repo
